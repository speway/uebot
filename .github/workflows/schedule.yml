name: Check P2-23 timetable
on:
  push:
    branches: [main]
  schedule:
    # Rotate the bounded watcher away from the overloaded start of the hour.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      recover_launch:
        description: Recover unconfirmed launch publications after token replacement
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: p223-timetable-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -q
      - name: Check setup
        id: setup
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Telegram secrets are not configured; publishing is disabled."
          fi
      - name: Read source and publish confirmed changes
        if: steps.setup.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          SOURCE_RELAY_URL: https://uebot.vercel.app/api/source
          RECOVER_LAUNCH: ${{ inputs.recover_launch }}
          WATCH_SECONDS: 19800
          CHECK_INTERVAL_SECONDS: 90
        run: python github_runner.py
